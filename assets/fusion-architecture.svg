<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Fusion architecture with image and position branches, cross attention, gating, LSTM and beam ranking"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7893b6"/></marker></defs><rect width="1200" height="560" rx="20" fill="#0c1428"/><g font-family="Arial,sans-serif"><text x="40" y="50" fill="#f1f5f9" font-size="26" font-weight="700">Two modalities. Shared context. Temporal decisions.</text><text x="40" y="80" fill="#94a3b8" font-size="15">ConvNeXtCAFormerLSTMBeamTracker · code implementation overview</text><rect x="40" y="125" width="245" height="90" rx="12" fill="#14223c" stroke="#67e8f9"/><text x="162.5" y="159" text-anchor="middle" fill="#67e8f9" font-size="19" font-weight="700">RGB image sequence</text><text x="162.5" y="187" text-anchor="middle" fill="#cbd5e1" font-size="14">Crop / full-image fallback</text><rect x="330" y="125" width="260" height="90" rx="12" fill="#14223c" stroke="#67e8f9"/><text x="460.0" y="159" text-anchor="middle" fill="#67e8f9" font-size="19" font-weight="700">ConvNeXt-Tiny</text><text x="460.0" y="187" text-anchor="middle" fill="#cbd5e1" font-size="14">Pretrained → 256-D tokens</text><rect x="40" y="270" width="245" height="90" rx="12" fill="#14223c" stroke="#c4b5fd"/><text x="162.5" y="304" text-anchor="middle" fill="#c4b5fd" font-size="19" font-weight="700">Position sequence</text><text x="162.5" y="332" text-anchor="middle" fill="#cbd5e1" font-size="14">4 steps × 21 input features</text><rect x="330" y="270" width="260" height="90" rx="12" fill="#14223c" stroke="#c4b5fd"/><text x="460.0" y="304" text-anchor="middle" fill="#c4b5fd" font-size="19" font-weight="700">Position MLP</text><text x="460.0" y="332" text-anchor="middle" fill="#cbd5e1" font-size="14">128 → 256-D tokens</text><rect x="680" y="177" width="465" height="105" rx="12" fill="#14223c" stroke="#a5b4fc"/><text x="912.5" y="211" text-anchor="middle" fill="#a5b4fc" font-size="19" font-weight="700">Bidirectional cross-attention</text><text x="912.5" y="239" text-anchor="middle" fill="#cbd5e1" font-size="14">2 blocks · 4 heads · residual feed-forward layers</text><rect x="680" y="320" width="465" height="85" rx="12" fill="#14223c" stroke="#67e8f9"/><text x="912.5" y="354" text-anchor="middle" fill="#67e8f9" font-size="19" font-weight="700">Position-guided image gate</text><text x="912.5" y="382" text-anchor="middle" fill="#cbd5e1" font-size="14">Sigmoid gate → image × gate → concatenate position</text><rect x="680" y="445" width="230" height="80" rx="12" fill="#14223c" stroke="#c4b5fd"/><text x="795.0" y="479" text-anchor="middle" fill="#c4b5fd" font-size="19" font-weight="700">Temporal LSTM</text><text x="795.0" y="507" text-anchor="middle" fill="#cbd5e1" font-size="14">256 hidden units</text><rect x="955" y="445" width="190" height="80" rx="12" fill="#14223c" stroke="#67e8f9"/><text x="1050.0" y="479" text-anchor="middle" fill="#67e8f9" font-size="19" font-weight="700">Beam ranking</text><text x="1050.0" y="507" text-anchor="middle" fill="#cbd5e1" font-size="14">Classifier → Top-k</text><path d="M285 170H330" fill="none" stroke="#7893b6" stroke-width="2" marker-end="url(#a)"/><path d="M285 315H330" fill="none" stroke="#7893b6" stroke-width="2" marker-end="url(#a)"/><path d="M590 170H635V207H680" fill="none" stroke="#7893b6" stroke-width="2" marker-end="url(#a)"/><path d="M590 315H635V250H680" fill="none" stroke="#7893b6" stroke-width="2" marker-end="url(#a)"/><path d="M912 282V320" fill="none" stroke="#7893b6" stroke-width="2" marker-end="url(#a)"/><path d="M912 405V425H795V445" fill="none" stroke="#7893b6" stroke-width="2" marker-end="url(#a)"/><path d="M910 485H955" fill="none" stroke="#7893b6" stroke-width="2" marker-end="url(#a)"/><text x="40" y="450" fill="#94a3b8" font-size="16">Architecture shown for the reviewed fusion variant.</text><text x="40" y="48